otel:
  file_format: "1.0"

  resource:
    detection/development:
      detectors:
        - service:
    attributes:
      - name: service.name
        value: "${OTEL_SERVICE_NAME:spring-petclinic}"
      - name: service.namespace
        value: petclinic
      - name: service.owner.url
        value: https://github.com/spring-projects/spring-petclinic
    attributes_list: "${OTEL_RESOURCE_ATTRIBUTES:}"

  propagator:
    composite:
      - tracecontext:

  tracer_provider:
    sampler:
      parent_based:
        root:
          trace_id_ratio_based:
            ratio: "${OTEL_TRACES_SAMPLER_ARG:0.1}"
    processors:
      - batch:
          exporter:
            otlp_http:
              endpoint: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces}"

  meter_provider:
    readers:
      - periodic:
          exporter:
            otlp_http:
              endpoint: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics}"

  distribution:
    spring_starter:
      instrumentation:
        default_enabled: false
        enabled:
          - jdbc
          - spring_webmvc

  instrumentation/development:
    general:
      sanitization:
        url:
          sensitive_query_parameters:
            - AWSAccessKeyId
            - Signature
            - sig
            - X-Goog-Signature
            - lastName
            - page
            - lang
    java:
      common:
        db:
          query_sanitization:
            enabled: true
