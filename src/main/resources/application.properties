# database init, supports mysql too
database=h2
spring.datasource.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# OpenTelemetry: export traces and metrics over OTLP. Environment variables can
# override every setting in production.
otel.service.name=spring-petclinic
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:0.1}
otel.propagators=tracecontext
otel.logs.exporter=none
otel.instrumentation.common.default-enabled=false
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.jdbc.statement-sanitizer.enabled=true
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.logback-mdc.enabled=true
